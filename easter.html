<!DOCTYPE html>
<html>
<head>
  <title>Get Input Value</title>
</head>
<body style="text-align: center; padding-top: 200px;">
  <input type="text" id="username" placeholder="输入 ** 数字">
  <button id="submitBtn">提交</button>
  <p id="displayText" style="font-weight: bold; font-size: 120pt; font-family: 
Arial, sans-serif; text-decoration: none; color: black;"></p>

  <script>
    const button = document.getElementById('submitBtn');
    const inputField = document.getElementById('username');
    const displayArea = document.getElementById('displayText');

    button.addEventListener('click', function() {
      // Grab the content
      const userInput = inputField.value;
      
      // Do something with the content
      displayArea.textContent = `${userInput}99`;
    });
  </script>
</body>
</html>
